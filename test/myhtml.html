<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>React Modal 组件</title>
    <style>
        /* ===== 全局重置 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 40px; background: #f0f2f5; }

        /* ===== 触发按钮 ===== */
        .demo-buttons { display: flex; gap: 12px; justify-content: center; margin-top: 40px; }
        .demo-btn { padding: 10px 24px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; transition: all 0.2s; }
        .demo-btn-primary { background: #1890ff; color: white; }
        .demo-btn-primary:hover { background: #40a9ff; }
        .demo-btn-danger { background: #ff4d4f; color: white; }
        .demo-btn-danger:hover { background: #ff7875; }

        /* ===== Modal 遮罩 ===== */
        .modal-mask {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ===== Modal 容器 ===== */
        .modal-container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.15);
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            animation: slideIn 0.25s ease;
            min-width: 320px;
        }

        @keyframes slideIn {
            from { transform: translateY(-20px) scale(0.96); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        /* ===== Header ===== */
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            border-bottom: 1px solid #f0f0f0;
        }
        .modal-title {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 22px;
            color: #999;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .modal-close:hover {
            background: #f5f5f5;
            color: #333;
        }

        /* ===== Body ===== */
        .modal-body {
            padding: 24px;
            flex: 1;
            overflow-y: auto;
            color: #333;
            line-height: 1.6;
        }

        /* ===== Footer ===== */
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 12px 24px;
            border-top: 1px solid #f0f0f0;
        }
        .modal-footer button {
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-cancel {
            background: #f5f5f5;
            color: #333;
        }
        .btn-cancel:hover {
            background: #e8e8e8;
        }
        .btn-confirm {
            background: #1890ff;
            color: white;
        }
        .btn-confirm:hover {
            background: #40a9ff;
        }
        .btn-confirm-danger {
            background: #ff4d4f;
            color: white;
        }
        .btn-confirm-danger:hover {
            background: #ff7875;
        }

        /* ===== 页面标题 ===== */
        .page-title {
            text-align: center;
            color: #1a1a1a;
            font-size: 24px;
            margin-top: 20px;
        }
        .page-sub {
            text-align: center;
            color: #999;
            font-size: 14px;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <!-- ===== 挂载点 ===== -->
    <div id="root"></div>

    <!-- ===== 引入 React 和 Babel ===== -->
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

    <!-- ===== 组件代码 ===== -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ============================================================
        // 1. Modal 组件
        // ============================================================
        const Modal = ({
            visible = false,
            title = '提示',
            children,
            size = 'medium',
            onConfirm,
            onCancel,
            confirmText = '确定',
            cancelText = '取消',
            maskClosable = true,
            footer = null,
            className = '',
            confirmDanger = false
        }) => {
            const modalRef = useRef(null);

            // 阻止滚动穿透
            useEffect(() => {
                if (visible) {
                    document.body.style.overflow = 'hidden';
                } else {
                    document.body.style.overflow = 'unset';
                }
                return () => {
                    document.body.style.overflow = 'unset';
                };
            }, [visible]);

            // ESC 键关闭
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape' && visible) {
                        onCancel?.();
                    }
                };
                document.addEventListener('keydown', handleKeyDown);
                return () => document.removeEventListener('keydown', handleKeyDown);
            }, [visible, onCancel]);

            // 点击遮罩关闭
            const handleMaskClick = (e) => {
                if (maskClosable && e.target === e.currentTarget) {
                    onCancel?.();
                }
            };

            if (!visible) return null;

            const sizeMap = {
                small: '400px',
                medium: '600px',
                large: '800px'
            };

            const confirmBtnClass = confirmDanger ? 'btn-confirm btn-confirm-danger' : 'btn-confirm';

            const modalContent = (
                <div className="modal-mask" onClick={handleMaskClick}>
                    <div
                        className={`modal-container ${className}`}
                        style={{ width: sizeMap[size] }}
                        ref={modalRef}
                    >
                        {/* 标题 */}
                        <div className="modal-header">
                            <span className="modal-title">{title}</span>
                            <button className="modal-close" onClick={onCancel}>×</button>
                        </div>

                        {/* 内容 */}
                        <div className="modal-body">
                            {children}
                        </div>

                        {/* 底部 */}
                        <div className="modal-footer">
                            {footer !== null ? footer : (
                                <>
                                    <button className="btn-cancel" onClick={onCancel}>
                                        {cancelText}
                                    </button>
                                    <button className={confirmBtnClass} onClick={onConfirm}>
                                        {confirmText}
                                    </button>
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );

            return ReactDOM.createPortal(modalContent, document.body);
        };

        // ============================================================
        // 2. App 示例
        // ============================================================
        const App = () => {
            const [visible, setVisible] = useState(false);
            const [modalType, setModalType] = useState('confirm');

            const showModal = (type) => {
                setModalType(type);
                setVisible(true);
            };

            const handleConfirm = () => {
                console.log('✅ 确认操作');
                setVisible(false);
            };

            return (
                <div>
                    <h1 className="page-title">📦 React Modal 组件</h1>
                    <p className="page-sub">使用 Portal 渲染，支持 ESC 关闭、滚动穿透阻止</p>

                    <div className="demo-buttons">
                        <button
                            className="demo-btn demo-btn-danger"
                            onClick={() => showModal('confirm')}
                        >
                            🗑️ 确认删除
                        </button>
                        <button
                            className="demo-btn demo-btn-primary"
                            onClick={() => showModal('info')}
                        >
                            ℹ️ 信息提示
                        </button>
                    </div>

                    <Modal
                        visible={visible}
                        title={modalType === 'confirm' ? '确认删除' : '提示信息'}
                        size="medium"
                        onConfirm={handleConfirm}
                        onCancel={() => setVisible(false)}
                        confirmText={modalType === 'confirm' ? '删除' : '知道了'}
                        cancelText="取消"
                        maskClosable={modalType === 'info'}
                        confirmDanger={modalType === 'confirm'}
                    >
                        {modalType === 'confirm' ? (
                            <div>
                                <p style={{ fontSize: '15px', marginBottom: '8px' }}>
                                    ⚠️ 确定要删除这条数据吗？
                                </p>
                                <p style={{ color: '#999', fontSize: '13px' }}>
                                    此操作不可恢复，请谨慎操作。
                                </p>
                            </div>
                        ) : (
                            <p style={{ fontSize: '15px' }}>
                                ✅ 操作已成功完成！
                            </p>
                        )}
                    </Modal>
                </div>
            );
        };

        // ============================================================
        // 3. 渲染到 DOM
        // ============================================================
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

</body>
</html>
